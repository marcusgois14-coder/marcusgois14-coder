<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <script>try{var t=localStorage.getItem('atual-admin-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Galeria de componentes · Painel Atual</title>
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Urbanist:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/css/admin.css">
  <style>
    /* só da galeria (página de desenvolvimento; não vai para o ar) */
    .g-wrap { max-width: 1240px; margin: 0 auto; padding: 24px 24px 120px; }
    .g-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .g-head img { height: 30px; margin-bottom: 14px; }
    .g-sec { margin-top: 28px; }
    .g-sec > h2 { margin-bottom: 12px; }
    .g-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .g-grid--2 { grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }
    .g-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .g-row + .g-row { margin-top: 10px; }
    .g-lbl { width: 92px; flex: none; font-size: 12.5px; color: var(--muted); font-weight: 500; }
    .g-sw { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
    .g-sw div { border-radius: 12px; border: 1px solid var(--line); overflow: hidden; background: var(--surface); }
    .g-sw span { display: block; height: 44px; }
    .g-sw small { display: block; padding: 6px 8px; font-size: 11.5px; color: var(--muted); font-family: var(--font-mono); }
    .g-navy { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-radius: 14px; background: #0c1b26; --focus: var(--focus-inverse); }
    .g-navy .btn--ghost { color: #fff; }
    .g-out { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font: 12px/1.5 var(--font-mono); color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; min-height: 40px; }
    .g-scroll { max-height: 220px; overflow: auto; }
    @media (max-width: 600px) { .g-wrap { padding: 16px 16px 120px; } .g-grid--2 { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body>
  <main id="root" class="g-wrap" data-view>
    <header class="g-head">
      <div>
        <img src="/assets/brand/atual-logo-horizontal.svg" alt="Atual Móveis" class="g-logo">
        <h1 class="page-title">Galeria de componentes</h1>
        <p class="page-sub">Página de desenvolvimento do painel (não vai para o ar). Tudo aqui usa admin.css e ui.js de verdade.</p>
      </div>
      <div data-theme-seg></div>
    </header>
    <div id="gallery"></div>
  </main>

  <script>
    // Esta página nunca fala com o Supabase: api.js recebe um cliente falso.
    window.ATUAL_CONFIG = { supabaseUrl: 'https://galeria.invalid', supabaseKey: 'galeria' };
    window.supabase = { createClient: () => new Proxy({}, { get: () => () => ({}) }) };
  </script>
  <script type="module">
import * as ui from '/admin/js/ui.js';
const { html, raw, render, $, $$, icon, badge, statusBadge, paymentBadge, productStatusBadge, money, toast, openModal, confirmDialog, promptDialog, drawer, readForm, showErrors,
  empty, loading, errorBlock, skeleton, tip, kpiCard, waitKpi, deltaPill, sparkline, areaChart, barChart, table, pager, segmented, avatar, storeMark, ageChip, livePill,
  pageHeader, art, field, switchField, selectOptions, multiSelect, initUI, getTheme, setTheme, registerStores, ORDER_STATUS } = ui;

const STORES = [
  ['pn', 'Atual Móveis', 'Ponte Nova', 2], ['tx', 'Atual Móveis', 'Teixeiras', 0], ['vi', 'Ativa Móveis', 'Viçosa', 2], ['ma', 'Atual Móveis', 'Mariana', 1],
  ['op', 'Atual Móveis', 'Ouro Preto', 1], ['ob', 'Atual Móveis', 'Ouro Branco', 0], ['mh', 'Atual Móveis', 'Manhuaçu', 0], ['mm', 'Atual Móveis', 'Manhumirim', 0, 'paused'],
  ['ca', 'Atual Móveis', 'Caratinga', 0], ['tm', 'Atual Móveis', 'Timóteo', 0], ['cf', 'Atual Móveis', 'Coronel Fabriciano', 0], ['vr', 'Atual Móveis', 'Visconde do Rio Branco', 1],
  ['lt', 'Loja Tavares', 'Ponte Nova', 0],
].map(([id, brand_name, city, pending, state]) => ({ id, brand_name, city, name: `${brand_name} - ${city}`, pending, state }));
registerStores(STORES);

const storeOptions = () =>
  STORES.map(
    (s) =>
      html`<option value="${s.id}" data-mark="${s.id}" data-hint="${s.brand_name} · ${s.city}/MG" data-keywords="${s.brand_name}" ${
        s.state === 'paused' ? raw('data-badge="Pedidos pausados" data-badge-tone="neu"') : s.pending ? raw(`data-badge="${s.pending} ${s.pending === 1 ? 'novo' : 'novos'}" data-badge-tone="new"`) : ''
      }>${s.brand_name === 'Atual Móveis' ? s.city : s.name}</option>`
  );
const KINDS = [['sofa', 'Sofá'], ['armchair', 'Poltrona'], ['chair', 'Cadeira'], ['bed', 'Cama'], ['mattress', 'Colchão'], ['wardrobe', 'Guarda-roupa'], ['dresser', 'Cômoda'], ['rack', 'Rack'], ['table', 'Mesa'], ['tv', 'TV'], ['fridge', 'Geladeira'], ['washer', 'Lava e seca'], ['stove', 'Fogão'], ['microwave', 'Micro-ondas']];
const CATS = [
  ['Sala de estar', [['sofas', 'Sofás', 48], ['poltronas', 'Poltronas', 12], ['racks', 'Racks e painéis', 21], ['mesas-centro', 'Mesas de centro', 9]]],
  ['Quarto', [['camas', 'Camas', 16], ['colchoes', 'Colchões', 22], ['guarda-roupas', 'Guarda-roupas', 31], ['comodas', 'Cômodas', 0]]],
  ['Cozinha', [['geladeiras', 'Geladeiras', 14], ['fogoes', 'Fogões', 11], ['micro', 'Micro-ondas', 7]]],
  ['Lavanderia', [['lavadoras', 'Lavadoras', 8], ['lava-seca', 'Lava e seca', 5]]],
];

function sec(title, body, sub = '') {
  return html`<section class="g-sec"><h2 class="h2">${title}${sub ? html` <span class="muted small" style="font-family:var(--font-ui);font-weight:500">${sub}</span>` : ''}</h2>${body}</section>`;
}
const card = (title, body, cls = '') => html`<div class="card ${cls}"><div class="card__head"><h3>${title}</h3></div><div class="card__body">${body}</div></div>`;

const sw = (name) => html`<div><span style="background:var(${name})"></span><small>${name}</small></div>`;

function build() {
  const out = [];
  out.push(
    sec(
      'Tokens',
      html`<div class="g-sw">${['--bg', '--surface', '--surface-2', '--surface-3', '--raised', '--line', '--line-strong', '--field-line', '--ink', '--text', '--muted', '--faint', '--accent', '--accent-ink', '--accent-soft', '--highlight', '--select', '--navy', '--ok-bg', '--warn-bg', '--info-bg', '--plum-bg', '--ora-bg', '--bad-bg', '--neu-bg'].map(sw)}</div>`
    )
  );
  out.push(
    sec(
      'Tipografia',
      html`<div class="card"><div class="card__body stack" style="--gap:10px">
      <div class="h1">Pedidos · h1 Urbanist 28/800</div><div class="h2">Resumo da rede · h2 19/800</div><div class="h3">Precisa de atenção · h3 16.5/700</div>
      <p>Corpo Inter 14/1.45 — A rede já vendeu <b>R$ 18.420,90</b> hoje em 12 pedidos.</p>
      <p class="muted small">Pequeno 12.5 muted · há 52 min</p><p><span class="code">AT001238 · AT001239 · 0O</span> · <span class="mono">SKU-SOF-210-VV</span> · <span class="overline">Lojas</span></p>
    </div></div>`
    )
  );
  out.push(
    sec(
      'Botões',
      html`<div class="card"><div class="card__body">
      ${[
        ['Primária', 'btn--primary', 'check', 'Salvar'],
        ['Secundária', '', 'download', 'Exportar'],
        ['Escura', 'btn--dark', 'check', 'Aplicar'],
        ['Fantasma', 'btn--ghost', 'sliders', 'Filtros'],
        ['Destrutiva', 'btn--danger', 'trash', 'Excluir'],
        ['Perigo (texto)', 'btn--danger-ghost', 'xCircle', 'Cancelar pedido'],
      ].map(
        ([l, c, i, t]) => html`<div class="g-row"><span class="g-lbl">${l}</span><button class="btn ${c}" type="button">${icon(i)} ${t}</button><button class="btn ${c} btn--sm" type="button">${icon(i)} ${t}</button><button class="btn ${c}" type="button" disabled>${icon(i)} ${t}</button><button class="btn ${c} btn--icon" type="button" aria-label="${t}">${icon(i)}</button></div>`
      )}
      <div class="g-row"><span class="g-lbl">Tamanhos</span><button class="btn btn--primary btn--lg" type="button">Entrar</button><button class="btn btn--touch" type="button">Toque 44</button><button class="btn btn--primary" type="button">Salvar produto <span class="kbd kbd--on-primary">Ctrl S</span></button><button class="btn" type="button" data-busy>Salvar com espera</button></div>
      <div class="g-row"><span class="g-lbl">Grupo</span><div class="btn-group"><button class="btn is-active" type="button">Dia</button><button class="btn" type="button">Semana</button><button class="btn" type="button">Mês</button></div><span class="kbd">Ctrl</span><span class="kbd">K</span></div>
      <div class="g-row"><span class="g-lbl">Na janela</span><div class="modal__foot" style="border-radius:12px;flex:1"><button class="btn" type="button">Voltar</button><button class="btn btn--danger" type="button">Cancelar pedido</button></div></div>
      <div class="g-row" style="margin-top:14px"><div class="g-navy"><span style="color:#c3ced8;font-size:12.5px">Foco sobre marinho</span><button class="btn btn--ghost" type="button">${icon('sync')} Mudar status</button><button class="btn btn--primary btn--sm" type="button">Salvar</button></div></div>
    </div></div>`
    )
  );
  out.push(
    sec(
      'Campos',
      html`<div class="card"><div class="card__body"><form class="form-grid" data-fields novalidate>
      <div class="field col-6"><label for="g-email">E-mail do cliente</label><input class="input" id="g-email" placeholder="nome@email.com"></div>
      <div class="field col-6"><label for="g-phone">Telefone <span class="opt-tag">opcional</span></label><input class="input" id="g-phone" value="(31) 98842-19"></div>
      <div class="field col-4"><label for="g-cep">CEP</label><input class="input" id="g-cep" value="35430-00" aria-invalid="true"><span class="error">CEP incompleto. Use 8 números.</span></div>
      <div class="field col-4"><label for="g-loja">Loja</label><input class="input" id="g-loja" value="Ponte Nova" disabled><span class="hint">Definida pelo seu acesso.</span></div>
      <div class="field col-4"><label for="g-preco">Preço</label><div class="input-group"><span class="input-group__addon">R$</span><input class="input" id="g-preco" value="3.499,90"></div></div>
      <div class="field col-12"><label for="g-desc">Descrição</label><textarea class="textarea" id="g-desc" placeholder="Conte o que o cliente precisa saber…"></textarea></div>
      <div class="col-12 g-row" style="gap:18px">
        <label class="check"><input type="checkbox"> Não</label><label class="check"><input type="checkbox" checked> Sim</label><label class="check"><input type="checkbox" data-mixed> Parcial</label><label class="check"><input type="checkbox" disabled> Bloqueado</label>
        <label class="check"><input type="radio" name="g-r"> Opção</label><label class="check"><input type="radio" name="g-r" checked> Escolhida</label>
        ${switchField({ label: 'Desligado', name: 'sw1' })}${switchField({ label: 'Ligado', name: 'sw2', checked: true, hint: 'Avisa a equipe com som' })}
      </div>
    </form></div></div>`
    )
  );

  // ---- selects ----
  out.push(
    sec(
      'Select personalizado',
      html`<div class="g-grid g-grid--2">
      <div class="card"><div class="card__body"><form class="form-grid" id="sel-form" novalidate>
        <div class="field col-6"><label for="sel-status">Status</label>
          <select class="select" id="sel-status" name="status">
            <option value="">Todos os status</option>
            ${Object.entries(ORDER_STATUS).map(([k, v], i) => html`<option value="${k}" data-dot="${ui.TONE[v.tone]}" data-meta="${[5, 2, 2, 1, 3, 1][i]}">${v.label}</option>`)}
          </select></div>
        <div class="field col-6"><label for="sel-pay">Forma de pagamento</label>
          <select class="select" id="sel-pay" name="pay" data-prefix="Pagamento">
            <option value="">Todas</option>
            ${Object.entries(ui.PAYMENT_METHOD).map(([k, v]) => html`<option value="${k}" data-icon="${ui.PAYMENT_ICON[k]}">${v}</option>`)}
          </select></div>
        <div class="field col-12"><label for="sel-cat">Categoria</label>
          <select class="select" id="sel-cat" name="category_id" required data-search-placeholder="Buscar categoria…">
            <option value="">Escolha a categoria</option>
            ${CATS.map(([g, kids]) => html`<optgroup label="${g}" data-count="${kids.reduce((a, k) => a + k[2], 0)}">${kids.map(([v, l, n]) => html`<option value="${v}" data-hint="${g} › ${l} · ${n} produtos" data-meta="${n}">${l}</option>`)}</optgroup>`)}
          </select><span class="hint">Categorias valem para a rede toda.</span></div>
        <div class="field col-6"><label for="sel-store">Loja</label><select class="select" id="sel-store" name="store">${storeOptions()}</select></div>
        <div class="field col-6"><label for="sel-color">Cor</label>
          <select class="select" id="sel-color" name="color">
            <option value="verde" data-swatch="#3f5b45" data-meta="#3f5b45">Veludo verde</option><option value="cinza" data-swatch="#8b8f94" data-meta="#8b8f94">Linho cinza</option>
            <option value="off" data-swatch="#f1ece2" data-meta="#f1ece2">Off white</option><option value="freijo" data-swatch="#a0703f" data-meta="#a0703f">Freijó</option>
            <option value="duo" data-swatch="#1d1813|#c8955f" data-meta="2 tons">Preto e carvalho</option><option value="bad" data-swatch="red;position:fixed" disabled>Cor inválida (desativada)</option>
          </select></div>
        <div class="field col-6"><label for="sel-kind">Tipo 3D</label>
          <select class="select" id="sel-kind" name="kind" data-search-placeholder="Buscar entre ${KINDS.length + 2} tipos…">
            <option value="auto" data-icon="auto" data-hint="Detectado pela categoria Sofás">Automático (Sofá)</option>
            <optgroup label="Escolher manualmente">${KINDS.map(([k, l]) => html`<option value="${k}" data-icon="${k}">${l}</option>`)}</optgroup>
            <option value="none" data-icon="none" data-hint="Esconde o botão “Ver em 3D” na loja">Sem 3D</option>
          </select></div>
        <div class="field col-6"><label for="sel-uf">Estado (UF)</label><select class="select" id="sel-uf" name="state">${selectOptions(['MG', 'SP', 'RJ', 'ES', 'BA', 'GO', 'PR', 'SC', 'RS', 'DF'].map((u) => [u, u]), 'MG')}</select></div>
        <div class="field col-6"><label for="sel-dis">Loja (sem permissão)</label><select class="select" id="sel-dis" name="locked" disabled><option>Ponte Nova</option></select><span class="hint">Sem permissão para trocar.</span></div>
        <div class="field col-6"><label for="sel-err">Motivo</label><select class="select" id="sel-err" name="reason" aria-invalid="true"><option value="">Escolha o motivo</option><option>Cliente desistiu da compra</option><option>Sem estoque</option></select><span class="error">Escolha o motivo do cancelamento.</span></div>
        <div class="field col-6"><label for="sel-busy">Lojas</label><select class="select" id="sel-busy" name="busy" aria-busy="true" data-placeholder="Carregando lojas…"></select></div>
        <div class="field col-6"><label for="sel-opts">Com opções desativadas</label><select class="select" id="sel-opts" name="opts"><option value="a">Rascunho</option><option value="b" disabled>Arquivado (sem permissão)</option><option value="c">Ativo</option><option value="d" disabled>Excluído</option><option value="e">Revisão</option></select></div>
        <div class="field col-12"><label for="sel-multi">Lojas (várias)</label><select class="select" id="sel-multi" name="stores" multiple>${storeOptions()}</select></div>
        <div class="field col-6"><label for="sel-native">Nativo (data-native)</label><select class="select" id="sel-native" name="native" data-native><option>01</option><option>02</option></select></div>
        <div class="field col-6"><label for="sel-hidden-opts">Opções escondidas</label><select class="select" id="sel-hidden-opts" name="hid"><option value="1">Visível 1</option><option value="2" hidden>Escondida</option><option value="3">Visível 3</option></select></div>
        <div class="col-12 g-row"><button class="btn btn--primary" type="submit">Enviar (readForm)</button><button class="btn" type="reset">Restaurar (reset)</button><button class="btn" type="button" data-errors>Mostrar erros</button></div>
        <div class="col-12 g-out" id="sel-out" aria-live="polite"></div>
      </form></div></div>
      <div class="stack">
        <div class="card"><div class="card__head"><h3>Mudanças por código</h3></div><div class="card__body stack" style="--gap:10px">
          <div class="g-row"><button class="btn btn--sm" type="button" data-prog="value">status.value = 'delivered'</button><button class="btn btn--sm" type="button" data-prog="index">status.selectedIndex = 2</button><button class="btn btn--sm" type="button" data-prog="optsel">option.selected = true</button></div>
          <div class="g-row"><button class="btn btn--sm" type="button" data-prog="rerender">Re-renderizar opções (innerHTML)</button><button class="btn btn--sm" type="button" data-prog="disable">Alternar disabled</button><button class="btn btn--sm" type="button" data-prog="hide">Alternar hidden</button><button class="btn btn--sm" type="button" data-prog="required">Alternar required</button></div>
          <div class="g-row"><button class="btn btn--sm" type="button" data-prog="replace">Trocar o select (replaceWith)</button><button class="btn btn--sm" type="button" data-prog="remove">Remover o select</button><button class="btn btn--sm" type="button" data-prog="add">Adicionar select novo</button></div>
          <div id="prog-slot" class="field"><label for="sel-prog">Select de testes</label><select class="select" id="sel-prog" name="prog"><option value="a">Alfa</option><option value="b">Beta</option><option value="c">Gama</option></select></div>
          <div class="g-out" id="prog-out"></div>
        </div></div>
        <div class="card"><div class="card__head"><h3>Barra de filtros (tamanho pequeno)</h3></div>
          <div class="toolbar toolbar--sm"><div class="search">${icon('search', 'icon-sm')}<input class="input select--sm" style="height:32px" placeholder="Buscar código, cliente…" aria-label="Buscar"></div>
          <select class="select select--sm" id="sel-sm" aria-label="Pagamento" data-prefix="Pagamento"><option value="">Todos</option><option value="paid" data-dot="ok">Pago</option><option value="pending" data-dot="warn">Pendente</option></select>
          ${segmented({ name: 'density', label: 'Densidade', options: [['compact', 'Compacta', 'rows'], ['comfy', 'Confortável', 'list']], value: 'compact', size: 'sm', icons: true })}</div>
        </div>
        <div class="card"><div class="card__head"><h3>Dentro de uma tabela com rolagem</h3></div>
          <div class="table-wrap g-scroll" id="scroll-wrap"><table class="table table--compact"><thead><tr><th>Pedido</th><th>Status</th><th>Loja</th></tr></thead><tbody>
          ${Array.from({ length: 8 }, (_, i) => html`<tr><td class="code">AT00${1230 + i}</td><td><select class="select select--sm" id="row-sel-${i}" aria-label="Status do pedido AT00${1230 + i}">${Object.entries(ORDER_STATUS).map(([k, v]) => html`<option value="${k}" data-dot="${ui.TONE[v.tone]}">${v.short}</option>`)}</select></td><td>${storeMark(STORES[i], 24)}</td></tr>`)}
          </tbody></table></div>
        </div>
        <div class="card"><div class="card__head"><h3>Em janelas</h3></div><div class="card__body g-row">
          <button class="btn" type="button" data-open="cancel">Cancelar pedido (janela)</button><button class="btn" type="button" data-open="drawer">Gaveta com select</button><button class="btn" type="button" data-open="confirm">Confirmação</button><button class="btn" type="button" data-open="prompt">Pergunta</button>
        </div></div>
        <div class="card"><div class="card__head"><h3>Período e barra de salvar</h3></div><div class="card__body stack" style="--gap:12px">
          <div class="g-row"><button class="select sel__trigger" style="width:auto" type="button" id="g-range"></button><span class="muted small" id="g-range-out"></span></div>
          <form class="stack" id="g-save-form" style="--gap:10px"><div class="field"><label for="g-save-name">Nome do produto</label><input class="input" id="g-save-name" name="name" value="Sofá 3 Lugares Retrô"></div>
            <div class="field"><label for="g-save-st">Status</label><select class="select" id="g-save-st" name="status"><option value="active" data-dot="ok">Ativo</option><option value="draft" data-dot="warn">Rascunho</option></select></div></form>
        </div></div>
        <div class="card"><div class="card__head"><h3>multiSelect() com cadeados</h3></div><div class="card__body"><div class="field" id="ms-slot"></div><div class="g-out" id="ms-out"></div></div></div>
      </div>
    </div>`
    )
  );

  out.push(
    sec(
      'Navegação',
      html`<div class="card"><div class="tabs" role="tablist"><button class="tab is-active" role="tab" aria-selected="true">Todos <span class="tab__n">14</span></button><button class="tab" role="tab" aria-selected="false"><span class="dot dot--sm t-warn"></span>Novos <span class="tab__n tab__n--warn">5</span></button><button class="tab" role="tab" aria-selected="false"><span class="dot dot--sm t-info"></span>Confirmados <span class="tab__n">2</span></button><button class="tab" role="tab" aria-selected="false"><span class="dot dot--sm t-plum"></span>Em separação <span class="tab__n">2</span></button></div>
      <div class="card__body stack" style="--gap:12px">

      drawer({
        title: 'Pedido AT001237',
        head: html`<div><div class="g-row" style="gap:8px">${storeMark(STORES[2], 24)}<span class="muted small">Ativa Móveis - Viçosa · pelo site</span></div><div class="g-row mt-2"><span class="drawer__code code">AT001237</span>${statusBadge('pending')}${ageChip(Date.now() - 74 * 60000, { prefix: 'aguardando há ' })}</div></div>`,
        nav: { index: 5, total: 14, onPrev: () => toast('Anterior', 'info', 1200), onNext: () => toast('Próximo', 'info', 1200) },
        body: html`<div class="field"><label for="dr-status">Mudar status</label><select class="select" id="dr-status">${Object.entries(ORDER_STATUS).map(([k2, v]) => html`<option value="${k2}" data-dot="${ui.TONE[v.tone]}">${v.label}</option>`)}</select></div><div class="callout callout--pix">${icon('pix')}<div><strong>PIX ainda não identificado</strong>Confira o extrato antes de confirmar.</div></div>${Array.from({ length: 6 }, (_, i) => html`<div class="dsec"><div class="dsec__head"><h3>Seção ${i + 1}</h3></div><p class="muted">Conteúdo para rolar a gaveta.</p></div>`)}`,
        side: html`<h3 class="h3">Histórico</h3><div class="timeline"><div class="timeline__item is-status">Pedido criado</div></div><div class="field"><label for="dr-vis">Visibilidade</label><select class="select" id="dr-vis"><option>Só a equipe</option><option>Visível ao cliente</option></select></div>`,
        foot: html`<button class="btn btn--danger-ghost" type="button" data-close>Cancelar pedido</button><span class="grow"></span><button class="btn" type="button">${icon('print')} Imprimir</button><button class="btn btn--primary" type="button">Confirmar pedido</button>`,
      });
    if (k === 'confirm') confirmDialog({ title: 'Sair sem salvar?', message: 'As alterações deste produto serão perdidas.', confirmLabel: 'Sair sem salvar', danger: true }).then((ok) => toast(ok ? 'Saiu' : 'Ficou', 'info'));
    if (k === 'prompt') promptDialog({ title: 'Nova categoria', label: 'Nome', required: true, hint: 'Aparece no menu da loja virtual.' }).then((v) => v !== null && toast(`Criada: ${v}`, 'success'));
  }
  if (e.target.closest('[data-busy]')) ui.withBusy(e.target.closest('[data-busy]'), () => new Promise((r) => setTimeout(r, 1200)));
});

  </script>
</body>
